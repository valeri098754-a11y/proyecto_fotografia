<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaturaLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="nav__logo" href="#">
        <span class="logo-icon">✿</span> NaturaLens
      </a>
      <ul class="nav__links">
        <li><a href="#" class="active">Inicio</a></li>
        <li><a href="#destacados">Portafolio</a></li>
        <li><a href="#destacados">Galerías</a></li>
        <li><a href="#">Explorar Categorías</a></li>
        <li><a href="#">Blog</a></li>
      </ul>
      <div class="nav__user">
        <img src="./imagenes/avatar1.jpg" alt="Usuario" class="user-avatar" />
        <img src="./imagenes/avatar2.jpg" alt="Usuario" class="user-avatar" />
        <div class="user-avatar user-avatar--icon">👤</div>
      </div>
      <button class="nav__toggle" aria-label="Abrir menú">
        <img src="./imagenes/list.svg" alt="Menú" />
      </button>
    </nav>

    <header class="hero">
      <video class="hero__bg" autoplay loop muted playsinline>
        <source src="./imagenes/montaña_video.mp4" type="video/mp4" />
      </video>
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1>Descubre la Belleza Natural</h1>
        <a href="#destacados" class="btn-informacion">Explora Galerías</a>
      </div>
    </header>

    <section id="destacados" class="destacados">
      <div class="destacados__decoracion decoracion--izq">❀</div>
      <div class="destacados__decoracion decoracion--der">❀</div>
      <div class="destacados__inner">
        <h2>Destacados del Mes</h2>
        <div class="galeria-grid">
          <div class="galeria-item"><img src="./imagenes/colibri.jpg" alt="Colibrí" /></div>
          <div class="galeria-item"><img src="./imagenes/zorro.jpg" alt="Zorro" /></div>
          <div class="galeria-item"><img src="./imagenes/telaraña.jpg" alt="Telaraña" /></div>
          <div class="galeria-item"><img src="./imagenes/tigre.jpg" alt="Tigre" /></div>
          <div class="galeria-item"><img src="./imagenes/lavanda.jpg" alt="Lavanda" /></div>
          <div class="galeria-item"><img src="./imagenes/bosque.jpg" alt="Bosque" /></div>
          <div class="galeria-item"><img src="./imagenes/galaxia.jpg" alt="Galaxia" /></div>
          <div class="galeria-item"><img src="./imagenes/coral.jpg" alt="Coral" /></div>
        </div>
        <a href="#" class="btn-informacion btn--grande">Explorar Todas las Galerías</a>
      </div>
    </section>
  </body>
</html>
